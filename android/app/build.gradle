plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.dergah.app"

    // Google Play: yeni uygulama ve güncellemeler API 36 (Android 16) hedeflemeli.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // flutter_local_notifications için gerekli (java.time vb. eski cihazlarda)
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.dergah.app"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Release AAB bilerek İMZASIZ üretilir; manuel olarak (apksigner/jarsigner) imzalanacak.
            // signingConfig tanımlanmadığı için Gradle imzasız AAB çıkarır.
            // LevelPlay için ProGuard/R8 kuralları (küçültme açıksa devreye girer).
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

// Firebase: google-services.json android/app/ içine konunca eklenti devreye girer.
// Dosya yoksa derleme normal devam eder (Firebase sessizce devre dışı kalır).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // --- Unity LevelPlay (ironSource) mediation (Worlds Merge ile aynı kurulum) ---
    // LevelPlay SDK'nın kendisi unity_levelplay_mediation eklentisiyle gelir (pubspec).
    // Eklentinin istediği Play Services bağımlılıkları:
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-basement:18.3.0'

    // --- Reklam ağ adaptörü: Unity Ads (5.15.0 ve üzeri Unity Ads SDK'sını içinde getirir) ---
    // Başka ağ açarsan (Pangle, Mintegral...) buraya onun adaptörünü de ekle;
    // eklenmeyen ağa istek gitmez. LevelPlay panelinde Setup > SDK Networks'ten de etkinleştir.
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.15.0'
}
